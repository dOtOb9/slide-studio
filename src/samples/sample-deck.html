<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="slide-size" content="1920x1080">
<style>
section { font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif; color: #1f2933; }
[data-ph="title"] { font-size: 72px; font-weight: 700; display: flex; align-items: flex-end; }
[data-ph="body"] { font-size: 40px; line-height: 1.6; }
[data-ph="body"] ul { margin: 0; padding-left: 1.2em; }
section[data-layout="cover"] { background: #1e3a5f; color: #fff; }
section[data-layout="cover"] [data-ph="title"] { font-size: 104px; }
section[data-layout="cover"] [data-ph="subtitle"] { font-size: 44px; opacity: .8; }
</style>
</head>
<body>
<template data-layout="cover">
  <div data-ph="title" style="left:160px; top:340px; width:1600px; height:200px"></div>
  <div data-ph="subtitle" style="left:160px; top:580px; width:1600px; height:80px"></div>
</template>
<template data-layout="title-body">
  <div data-ph="title" style="left:120px; top:60px; width:1680px; height:140px; border-bottom:4px solid #1e3a5f"></div>
  <div data-ph="body" style="left:120px; top:260px; width:1680px; height:740px"></div>
</template>
<template data-layout="blank"></template>

<section data-layout="cover">
  <div data-ph="title">Slide Studio</div>
  <div data-ph="subtitle">HTMLで書けて、GUIで直せるスライド</div>
</section>
<section data-layout="title-body">
  <div data-ph="title">このファイルの仕組み</div>
  <div data-ph="body"><ul><li>&lt;template data-layout&gt; がレイアウト（マスター）</li><li>data-ph はプレースホルダー。位置はレイアウトから継承する</li><li>data-el は自由配置の要素。位置を自分で持つ</li></ul></div>
</section>
<section data-layout="title-body">
  <div data-ph="title">位置の上書きと自由配置</div>
  <div data-ph="body" style="width:1000px">本文の幅だけをスライド側で上書きしています。右の円と四角は、レイアウトに無い自由配置の要素です。</div>
  <div data-el style="left:1240px; top:300px; width:520px; height:520px; background:#f4a259; border-radius:50%"></div>
  <img data-el src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 3'%3E%3Crect width='4' height='3' fill='%232a9d8f'/%3E%3C/svg%3E" alt="" style="left:1500px; top:640px; width:320px; height:240px">
</section>
<section data-layout="blank">
  <div data-el style="left:0px; top:0px; width:1920px; height:1080px; background:linear-gradient(135deg, #1e3a5f, #2a9d8f)"></div>
  <div data-el style="left:200px; top:440px; width:1520px; height:200px; color:#fff; font-size:96px; font-weight:700; text-align:center">blank レイアウト：全部自由配置</div>
</section>
</body>
</html>
