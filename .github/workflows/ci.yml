# テストの CI: 型チェック → lint → 単体テスト。
# 今はリリースしないので、インストーラーの作成やデプロイは入れていない（後で足す）。

name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 同じコミットを2回走らせない。
    # 同じリポジトリのブランチからの PR は、push の実行が同じコミットに付いて PR にも表示されるので、
    # pull_request の方は飛ばす（skipped は失敗扱いにならない）。フォークからの PR だけ pull_request で走らせる。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
